<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Mesaj — CODEGA Mail</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Ayrı mesaj penceresi - basit ve odaklanmış */
    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
    }
    .mw-toolbar {
      background: var(--bg-2);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }
    .mw-toolbar .btn {
      font-size: 12px;
      padding: 5px 10px;
    }
    .mw-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px;
    }
    .mw-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--muted);
      font-size: 13px;
    }
    .mw-subject {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .mw-meta {
      display: grid;
      grid-template-columns: 70px 1fr;
      gap: 6px 14px;
      font-size: 12px;
      color: var(--text-2);
      padding: 12px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .mw-meta-label {
      font-weight: 600;
      color: var(--muted);
    }
    .mw-body {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }
    .mw-body img { max-width: 100%; height: auto; }
    .mw-body a { color: var(--primary); }
    .mw-attachments {
      margin-top: 16px;
      padding: 12px;
      background: var(--bg-2);
      border-radius: 6px;
      border-left: 3px solid var(--primary);
    }
    .mw-attachment-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--surface);
      border-radius: 4px;
      margin-top: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="mw-toolbar">
    <button class="btn" id="mwReply">↩ Yanıtla</button>
    <button class="btn" id="mwReplyAll">↩↩ Tümünü Yanıtla</button>
    <button class="btn" id="mwForward">→ İlet</button>
    <button class="btn btn-ghost" id="mwArchive" title="Arşivle">📦</button>
    <button class="btn btn-ghost" id="mwDelete" title="Sil" style="color:var(--danger);">🗑</button>
    <div style="flex:1;"></div>
    <span id="mwAccount" style="font-size:11px;color:var(--muted);"></span>
    <button class="btn btn-ghost" onclick="window.close()" title="Kapat (Ctrl+W)">✕</button>
  </div>
  <div class="mw-content" id="mwContent">
    <div class="mw-loading">⏳ Mesaj yükleniyor...</div>
  </div>
  <script src="message-window.js"></script>
</body>
</html>
